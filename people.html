      <div class="person-detail" id="personDetail">
        <p class="detail-hint">Click someone above to read about them.</p>

  <script>
    var grid = document.getElementById('peopleGrid');
    var detail = document.getElementById('personDetail');
    var people = grid.querySelectorAll('.person');

    people.forEach(function (person) {
      person.addEventListener('click', function () {
        var wasActive = person.classList.contains('active');
        people.forEach(function (p) { p.classList.remove('active'); });
        if (wasActive) {
          grid.classList.add('snap');
          grid.classList.remove('focused');
          clearTimeout(grid._snapTimer);
          grid._snapTimer = setTimeout(function () {
            grid.classList.remove('snap');
          }, 400);
          detail.innerHTML = '<p class="detail-hint">Click someone above to read about them.</p>';
          return;
        }
        grid.classList.remove('snap');
        grid.classList.add('focused');
        person.classList.add('active');
        var linkedin = person.dataset.linkedin;
        detail.innerHTML =
          '<h3>' + person.dataset.name + '</h3>' +
          '<p class="person-role">' + person.dataset.role + '</p>' +
          '<p class="note">' + person.dataset.note + '</p>' +
          (linkedin ? '<a class="detail-link" href="' + linkedin + '" target="_blank" rel="noopener">LinkedIn ↗</a>' : '');
      });
    });
  </script>
